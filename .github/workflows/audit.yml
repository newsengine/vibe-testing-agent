# Reusable dependency audit — checks out the CALLER's repo, installs deps, runs `vibetesting-agent audit`.
#
#   jobs:
#     deps:
#       uses: newsengine/vibe-testing-agent/.github/workflows/audit.yml@main
#       with:
#         level: high          # low | moderate | high | critical (default high)
#         prod_only: false     # audit only production deps
#         node_version: '20'
#
name: security-audit
on:
  workflow_call:
    inputs:
      level: { required: false, type: string, default: 'high' }
      prod_only: { required: false, type: boolean, default: false }
      node_version: { required: false, type: string, default: '20' }

# Read-only token: enough to check out the caller's repo, nothing else.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - run: npm ci || npm install
      - name: vibetesting-agent audit
        shell: bash
        env:
          # Inputs reach the shell only as env vars (never interpolated into the script).
          IN_LEVEL: ${{ inputs.level }}
          IN_PROD_ONLY: ${{ inputs.prod_only }}
        run: |
          ARGS=(audit --level "$IN_LEVEL")
          if [ "$IN_PROD_ONLY" = "true" ]; then ARGS+=(--prod); fi
          npx --yes vibetesting-agent@0.6.1 "${ARGS[@]}"
