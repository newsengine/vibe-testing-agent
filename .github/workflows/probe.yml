# Reusable full-app scan — call from ANY repo's workflow:
#
#   jobs:
#     scan:
#       uses: newsengine/vibe-testing-agent/.github/workflows/probe.yml@main
#       with:
#         url: https://your-deploy.example.com
#         only: secrets,exposure,security   # optional — restrict to these categories
#         skip: seo,a11y                     # optional — run everything except these
#         cors_path: /api/public/health      # optional
#         fail_on: high                       # high | medium | any (default high)
#         allow_report_only_csp: true         # optional, while CSP is still Report-Only
#       secrets:
#         CF_SMOKE_KEY: ${{ secrets.CF_SMOKE_KEY }}                 # optional x-smoke-key
#         CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}   # beta Access only
#         CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
#
name: app-scan
on:
  workflow_call:
    inputs:
      url: { required: true, type: string }
      only: { required: false, type: string, default: '' }
      skip: { required: false, type: string, default: '' }
      cors_path: { required: false, type: string, default: '' }
      rate_limit_path: { required: false, type: string, default: '' }
      fail_on: { required: false, type: string, default: 'high' }
      allow_report_only_csp: { required: false, type: boolean, default: false }
    secrets:
      CF_SMOKE_KEY: { required: false }
      CF_ACCESS_CLIENT_ID: { required: false }
      CF_ACCESS_CLIENT_SECRET: { required: false }

# The scan needs no repo access; the token gets no scopes.
permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run vibetesting-agent full scan
        shell: bash
        env:
          # Auto-attached by src/cf-bypass-headers.ts when set.
          # Access headers apply only if inputs.url host is beta.dynamicbusiness.com.
          CF_SMOKE_KEY: ${{ secrets.CF_SMOKE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # Inputs reach the shell only as env vars (never interpolated into the script).
          IN_URL: ${{ inputs.url }}
          IN_FAIL_ON: ${{ inputs.fail_on }}
          IN_ONLY: ${{ inputs.only }}
          IN_SKIP: ${{ inputs.skip }}
          IN_CORS_PATH: ${{ inputs.cors_path }}
          IN_RATE_LIMIT_PATH: ${{ inputs.rate_limit_path }}
          IN_ALLOW_REPORT_ONLY_CSP: ${{ inputs.allow_report_only_csp }}
        run: |
          ARGS=("$IN_URL" --fail-on "$IN_FAIL_ON")
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          if [ -n "$IN_SKIP" ]; then ARGS+=(--skip "$IN_SKIP"); fi
          if [ -n "$IN_CORS_PATH" ]; then ARGS+=(--cors-path "$IN_CORS_PATH"); fi
          if [ -n "$IN_RATE_LIMIT_PATH" ]; then ARGS+=(--rate-limit-path "$IN_RATE_LIMIT_PATH"); fi
          if [ "$IN_ALLOW_REPORT_ONLY_CSP" = "true" ]; then ARGS+=(--allow-report-only-csp); fi
          npx --yes vibetesting-agent@0.6.1 "${ARGS[@]}"
